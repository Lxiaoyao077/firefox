name: Build Fenix APK (Firefox for Android)

on:
  workflow_dispatch:

concurrency:
  group: fenix-apk-build
  cancel-in-progress: false

env:
  # Restrict Fenix ABI splits to arm64-v8a everywhere (mach build's internal
  # Gradle invocations honor GRADLE_FLAGS; see fenix/app/build.gradle splits block).
  GRADLE_FLAGS: -PbenchmarkTest=true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk \
            /imagegeneration/installers/* 2>/dev/null || true
          sudo docker image prune -af || true
          df -h /

      - name: Restore sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-linux-v1
          restore-keys: sccache-linux-

      - name: Install sccache (best effort, for Rust compilation caching)
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/sccache.tar.gz https://github.com/mozilla/sccache/releases/download/v0.9.1/sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          sudo install /tmp/sccache-v0.9.1-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Shallow clone upstream monorepo
        run: git clone --depth 1 https://github.com/mozilla-firefox/firefox.git firefox

      - name: Bootstrap (mobile_android)
        working-directory: firefox
        run: |
          ./mach --no-interactive bootstrap --application-choice mobile_android
          echo "--- mozconfig ---"
          cat mozconfig || true

      - name: Ensure mozconfig targets Android
        working-directory: firefox
        run: |
          if [ ! -f mozconfig ]; then
            printf 'ac_add_options --enable-application=mobile/android\n' > mozconfig
            echo "created default mozconfig"
          fi
          cat mozconfig

      # mach build compiles Gecko, publishes the local GeckoView AAR into the
      # objdir maven repo and sets up the Gradle configuration rooted at the
      # top source directory. GRADLE_FLAGS restricts its ABI splits to arm64-v8a.
      - name: Build (Gecko + local GeckoView)
        working-directory: firefox
        run: ./mach build

      # Fenix has no product flavors: Gradle tasks are named by buildType only,
      # so the release APK task is ":fenix:assembleRelease". Locally (not
      # MOZ_AUTOMATION) the release buildType is signed with the debug keystore,
      # so the APK is directly installable.
      - name: Assemble Fenix release APK (arm64-v8a only)
        working-directory: firefox
        run: ./mach gradle -PbenchmarkTest=true :fenix:assembleRelease

      - name: Collect APKs
        run: |
          cd firefox
          mkdir -p ../apks
          find . -name '*arm64-v8a*release*.apk' -print0 | \
            while IFS= read -r -d '' f; do cp --parents "$f" ../apks/; done
          if [ -z "$(ls -A ../apks 2>/dev/null)" ]; then
            echo "No release APK matched; falling back to every arm64-v8a APK"
            find . -name '*arm64-v8a*.apk' -print0 | \
              while IFS= read -r -d '' f; do cp --parents "$f" ../apks/; done
          fi
          echo "All APKs present in the tree:"
          find . -name '*.apk' -exec ls -lh {} \;
          echo "Collected for upload:"
          find ../apks -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenix-apks-${{ github.run_id }}
          path: apks/
          if-no-files-found: error
          retention-days: 14
