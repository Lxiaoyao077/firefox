name: Build Fenix APK (Firefox for Android)

on:
  workflow_dispatch:
    inputs:
      fast:
        description: 'Fast dev build (skip R8 minification, bigger APK)'
        type: boolean
        default: false

concurrency:
  group: fenix-apk-build
  cancel-in-progress: false

env:
  # Restrict Fenix ABI splits to arm64-v8a everywhere (mach build's internal
  # Gradle invocations honor GRADLE_FLAGS; see fenix/app/build.gradle splits block).
  GRADLE_FLAGS: -PbenchmarkTest=true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # Check out THIS fork, so local commits to mobile/android/fenix are built.
      # Keep in sync with upstream via the GitHub "Sync fork" button.
      - name: Check out this repository (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: firefox

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk \
            /imagegeneration/installers/* 2>/dev/null || true
          sudo docker image prune -af || true
          df -h /

      - name: Restore sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-linux-v2
          restore-keys: sccache-linux-

      - name: Install latest sccache
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/mozilla/sccache/releases/latest | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"])')
          echo "sccache version: $TAG"
          curl -fsSL -o /tmp/sccache.tar.gz "https://github.com/mozilla/sccache/releases/download/${TAG}/sccache-${TAG}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          sudo install "/tmp/sccache-${TAG}-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache
          echo "SCCACHE_CACHE_SIZE=8G" >> "$GITHUB_ENV"

      - name: Bootstrap (mobile_android)
        working-directory: firefox
        run: |
          ./mach --no-interactive bootstrap --application-choice mobile_android
          echo "--- mozconfig ---"
          cat mozconfig || true

      - name: Ensure mozconfig targets Android
        working-directory: firefox
        run: |
          if [ ! -f mozconfig ]; then
            printf 'ac_add_options --enable-application=mobile/android\n' > mozconfig
            echo "created default mozconfig"
          fi
          cat mozconfig

      # Local commits on top of upstream mean no prebuilt artifact exists for
      # this exact revision, so artifact mode is only a opportunistic attempt;
      # the fallback full build with sccache ("--with-ccache=sccache") is the
      # expected path and gets 2-3x faster compiles on a warm cache.
      - name: Build (artifact attempt, fallback to full build with sccache)
        working-directory: firefox
        run: |
          cp mozconfig /tmp/mozconfig.orig
          printf 'ac_add_options --enable-artifact-builds\n' >> mozconfig
          echo "=== Attempting artifact build for revision $(git rev-parse --short HEAD) ==="
          if ./mach build; then
            echo "BUILD_MODE=artifact" >> "$GITHUB_ENV"
            echo "=== Artifact build OK ==="
          else
            echo "=== Artifact build failed; falling back to full build with sccache ==="
            grep -v 'enable-artifact-builds' /tmp/mozconfig.orig > mozconfig
            printf 'ac_add_options --with-ccache=sccache\n' >> mozconfig
            rm -rf obj-*
            cat mozconfig
            ./mach build
            echo "BUILD_MODE=full" >> "$GITHUB_ENV"
          fi

      # Fenix has no product flavors: Gradle tasks are named by buildType only,
      # so the release APK task is ":fenix:assembleRelease". Locally (not
      # MOZ_AUTOMATION) the release buildType is signed with the debug keystore,
      # so the APK is directly installable. The "fast" input skips R8
      # minification (-PdisableOptimization) to shave 15-30 min off dev builds.
      - name: Assemble Fenix release APK (arm64-v8a only)
        working-directory: firefox
        env:
          FAST: ${{ github.event.inputs.fast }}
        run: |
          sccache --show-stats || true
          EXTRA=""
          if [ "$FAST" = "true" ]; then EXTRA="-PdisableOptimization"; fi
          ./mach gradle -PbenchmarkTest=true $EXTRA :fenix:assembleRelease

      - name: Collect APKs
        run: |
          cd firefox
          mkdir -p ../apks
          find . -name '*arm64-v8a*release*.apk' -print0 | \
            while IFS= read -r -d '' f; do cp --parents "$f" ../apks/; done
          if [ -z "$(ls -A ../apks 2>/dev/null)" ]; then
            echo "No release APK matched; falling back to every arm64-v8a APK"
            find . -name '*arm64-v8a*.apk' -print0 | \
              while IFS= read -r -d '' f; do cp --parents "$f" ../apks/; done
          fi
          echo "Build mode: ${BUILD_MODE:-unknown}"
          echo "Collected for upload:"
          find ../apks -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenix-apks-${{ github.run_id }}
          path: apks/
          if-no-files-found: error
          retention-days: 14
